databases:
  - name: lenny-db
    databaseName: lenny_db
    user: lenny
    plan: starter

services:
  - type: web
    name: lenny-backend
    plan: starter
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TRANSCRIPTS_DIR
        value: /opt/render/project/src/data/transcripts
      - key: VECTOR_INDEX_PATH
        value: /opt/render/project/src/data/vector_index
      - key: CHUNK_SIZE
        value: "800"
      - key: CHUNK_OVERLAP
        value: "100"
      - key: TOP_K_RESULTS
        value: "5"
      - key: ALLOWED_ORIGINS
        value: https://lenny-frontend.onrender.com,http://localhost:3000
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13"

  - type: web
    name: lenny-frontend
    plan: starter
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://lenny-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://lenny-backend.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://lenny-backend.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html
